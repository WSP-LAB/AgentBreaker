            // Update context data state
            state.consentInfoResponse = eventData;

            // Run state change logic after each valid context data response
            handleContextDataStateChange();
            return;
        }

        // Validate and handle jurisdiction info event if needed
        if (isJurisdictionInfoEvent(eventData) && !state.jurisdictionInfoResponse) {
            console.log('[gtm-wrapper] received jurisdiction info event', eventData);

            // Update context data state
            state.jurisdictionInfoResponse = eventData;

            // Run state change logic after each valid context data response
            handleContextDataStateChange();
            return;
        }
    };

    // Setup window post message events
    var setupMessageEventListeners = function () {
        window.addEventListener(POST_MESSAGE_EVENT_TYPE, handlePostMessageEvent);
    };

    // Remove window post message events
    var teardownMessageEventListeners = function () {
        window.removeEventListener(POST_MESSAGE_EVENT_TYPE, handlePostMessageEvent);
    };

    // Initialize the state machine
    var init = function () {
        // Log on init
        console.log('[gtm-wrapper] initializing...');

        // Setup post message listeners
        setupMessageEventListeners();

        // Request all context data for consent checks
        requestConsentContextData();

        // Trigger the initial GTM event immediately
        triggerGtmEvent();
        console.log(
            '[gtm-wrapper] postmessage sent to request consent data. Now waiting for consent data...'
        );
    };

    // Run init immediately
    console.log('[gtm-wrapper] waiting 300ms to start...');
    setTimeout(init, 300);
})();
